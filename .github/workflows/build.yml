name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/assets

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html style.css script.js *.woff2 www/
          sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      # --- تنظیمات جدید برای سازگاری با گوشی‌های قدیمی و ساخت Universal APK ---
      - name: Configure Android Build Settings
        run: |
          node -e "
            const fs = require('fs');
            
            // 1. تنظیم نسخه‌های اندروید در variables.gradle
            let vars = fs.readFileSync('android/variables.gradle', 'utf8');
            vars = vars.replace(/minSdkVersion = \d+/, 'minSdkVersion = 23');
            vars = vars.replace(/targetSdkVersion = \d+/, 'targetSdkVersion = 33');
            fs.writeFileSync('android/variables.gradle', vars);

            // 2. اجبار به ساخت APK جامع (Universal) بدون تقسیم‌بندی معماری
            let buildGradle = fs.readFileSync('android/app/build.gradle', 'utf8');
            if (!buildGradle.includes('splits {')) {
              buildGradle = buildGradle.replace('android {', 'android {\n    splits {\n        abi {\n            enable false\n        }\n    }');
              fs.writeFileSync('android/app/build.gradle', buildGradle);
            }
          "

      - name: Download Alarm Sound
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -f -L -o android/app/src/main/res/raw/alarm.mp3 "https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Sample-files/master/sample.mp3"

      - name: Generate App Icons
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/splash.png
          cp icon.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f1115' --iconBackgroundColorDark '#0f1115' --splashBackgroundColor '#0f1115' --splashBackgroundColorDark '#0f1115'

      - name: Inject Permissions safely
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(p, 'utf8');
            if (!xml.includes('SCHEDULE_EXACT_ALARM')) {
              const perms = '<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />\n' +
                            '<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />\n' +
                            '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n' +
                            '<uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n' +
                            '<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />\n';
              xml = xml.replace('<application', perms + '<application');
              fs.writeFileSync(p, xml);
            }
          "

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Restore Keystore
        run: |
          CLEAN_BASE64=$(echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r' | sed 's/-----BEGIN CERTIFICATE-----//g' | sed 's/-----END CERTIFICATE-----//g')
          echo "$CLEAN_BASE64" | base64 -d > android/app/release.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
