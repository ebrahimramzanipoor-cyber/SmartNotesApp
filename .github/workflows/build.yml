name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html style.css script.js *.woff2 www/
          sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      # دانلود فایل صوتی از یک لینک پایدار و مطمئن
      - name: Download Alarm Sound
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -f -L -o android/app/src/main/res/raw/alarm.mp3 "https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Sample-files/master/sample.mp3"

      # تزریق مجوزهای حیاتی برای آلارم در پس‌زمینه
      - name: Inject Permissions into Manifest
        run: |
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /> \
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" /> \
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" /> \
              <uses-permission android:name="android.permission.WAKE_LOCK" /> \
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' android/app/src/main/AndroidManifest.xml

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
