name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/assets

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html style.css script.js *.woff2 www/
          sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Download Alarm Sound
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -f -L -o android/app/src/main/res/raw/alarm.mp3 "https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Sample-files/master/sample.mp3"

      # این بخش اصلاح شد تا فایل icon.png را به درستی پیدا و تبدیل کند
      - name: Generate App Icons
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/splash.png
          cp icon.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f1115' --iconBackgroundColorDark '#0f1115' --splashBackgroundColor '#0f1115' --splashBackgroundColorDark '#0f1115'

      - name: Inject Permissions safely
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(p, 'utf8');
            if (!xml.includes('SCHEDULE_EXACT_ALARM')) {
              const perms = '<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />\n' +
                            '<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />\n' +
                            '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n' +
                            '<uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n' +
                            '<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />\n';
              xml = xml.replace('<application', perms + '<application');
              fs.writeFileSync(p, xml);
            }
          "

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
