name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html style.css script.js *.woff2 www/
          sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      # این مرحله جدید است: دانلود فایل صدای آلارم به داخل پروژه اندروید
      - name: Download Alarm Sound
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -L -o android/app/src/main/res/raw/alarm.mp3 "https://raw.githubusercontent.com/freeCodeCamp/cdn/master/build/testable-projects-fcc/audio/Beep.mp3"

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
